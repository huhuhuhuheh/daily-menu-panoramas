name: Crowdin Translations Check

on:
  push:
    branches:
      - l10n_crowdin
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: crowdin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json-check:
    name: Check 1 (JSON Valid)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.head_commit != null && (github.event.head_commit.committer.username == 'crowdin-bot' || github.event.head_commit.committer.username == 'huhuhuhuheh'))
    outputs:
      pr: ${{ steps.inprogress.outputs.pr }}
      cid: ${{ steps.inprogress.outputs.cid }}
    env:
      GH_TOKEN: ${{ github.token }}
      LANG_DIR: src/main/resources/assets/daily_menu_panoramas/lang
    steps:
      - name: Post In Progress comment
        id: inprogress
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BODY="Crowdin valid syntax, which uhh validates the syntax

          **Check 1 (JSON Valid)**: In Progress...

          **Check 2 (Translation compiling)**: In Progress..."
          PR=$(gh pr list --repo "$REPO" --head l10n_crowdin --json number --jq '.[0].number' || true)
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "::warning::No PR found for l10n_crowdin, skipping comment"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.body | startswith("Crowdin valid syntax")) | .id' | head -1)
          if [ -z "$CID" ] || [ "$CID" = "null" ]; then
            jq -n --arg body "$BODY" '{body: $body}' > /tmp/payload.json
            CID=$(gh api -X POST "repos/$REPO/issues/$PR/comments" --input /tmp/payload.json --jq '.id')
          fi
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l10n_crowdin

      - name: Download jsonfmt
        run: |
          curl -fsSL -o jsonfmt https://raw.githubusercontent.com/mrvi0/cli-json-formatter/main/jsonfmt
          chmod +x jsonfmt

      - name: Validate translations and update comment
        id: validate
        env:
          CID: ${{ steps.inprogress.outputs.cid }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          MARKER='**Check 1 (JSON Valid)**'
          cat > /tmp/update_check.py <<'PYEOF'
          import sys
          new_section = sys.argv[1]
          path = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              body = f.read()
          marker = "**Check 2 (Translation compiling)**"
          head, sep, tail = body.partition(marker)
          before, _, _ = head.partition("**Check 1 (JSON Valid)**")
          with open(path, 'w', encoding='utf-8') as f:
              f.write(before + new_section + "\n\n" + sep + tail)
          PYEOF
          INVALID=0
          REPORT=""
          for f in "$LANG_DIR"/*.json; do
            if ! ./jsonfmt -f "$f" >/dev/null 2>&1; then
              INVALID=1
              ERR=$(jq . "$f" 2>&1 | head -1)
              REPORT+="
            The file(s) \`$f\` seem to be invalid by the program:

            \`\`\`
            $ERR
            \`\`\`
            "
            fi
          done
          if [ "$INVALID" -eq 1 ]; then
            CHECK1="$MARKER: JSON is invalid
            $REPORT
            An editor has to manually push a change, either to [Crowdin](https://crowdin.com/editor/daily-menu-panoramas/16) or to [the branch](https://github.com/huhuhuhuheh/daily-menu-panoramas/tree/l10n_crowdin)"
          else
            CHECK1="$MARKER: JSON is valid"
          fi
          if [ -n "${CID:-}" ]; then
            gh api "repos/$REPO/issues/comments/$CID" --jq '.body' > /tmp/current.md
            python3 /tmp/update_check.py "$CHECK1" /tmp/current.md
            jq -n --rawfile body /tmp/current.md '{body: $body}' > /tmp/payload.json
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input /tmp/payload.json >/dev/null
          fi
          if [ "$INVALID" -eq 1 ]; then
            echo "json_valid=no" >> "$GITHUB_OUTPUT"
          else
            echo "json_valid=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail run if JSON is invalid
        if: steps.validate.outputs.json_valid == 'no'
        run: exit 1

      - name: Cleanup
        if: always()
        run: rm -f jsonfmt /tmp/payload.json /tmp/current.md /tmp/update_check.py || true

  build-check:
    name: Check 2 (Translation compiling)
    runs-on: ubuntu-latest
    needs: json-check
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.head_commit != null && (github.event.head_commit.committer.username == 'crowdin-bot' || github.event.head_commit.committer.username == 'huhuhuhuheh'))) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CID: ${{ needs.json-check.outputs.cid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l10n_crowdin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and update comment
        id: build
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          MARKER='**Check 2 (Translation compiling)**'
          cat > /tmp/update_check2.py <<'PYEOF'
          import sys
          new_section = sys.argv[1]
          path = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              body = f.read()
          marker = "**Check 2 (Translation compiling)**"
          before, _, _ = body.partition(marker)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(before + new_section)
          PYEOF
          chmod +x gradlew
          ./gradlew build --no-daemon > /tmp/build.log 2>&1
          BUILD_OK=$?
          if [ "$BUILD_OK" -eq 0 ]; then
            CHECK2="$MARKER: Compiles"
          else
            TAIL=$(tail -n 15 /tmp/build.log || true)
            CHECK2="$MARKER: Failed

          <details>
          <summary>Build log (last lines)</summary>

          \`\`\`
          $TAIL
          \`\`\`
          </details>"
          fi
          if [ -n "${CID:-}" ]; then
            gh api "repos/$REPO/issues/comments/$CID" --jq '.body' > /tmp/current.md
            python3 /tmp/update_check2.py "$CHECK2" /tmp/current.md
            jq -n --rawfile body /tmp/current.md '{body: $body}' > /tmp/payload.json
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input /tmp/payload.json >/dev/null
          else
            echo "::warning::No comment id from json-check, skipping comment update"
          fi
          if [ "$BUILD_OK" -eq 0 ]; then
            echo "build_ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build_ok=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail run if build failed
        if: steps.build.outputs.build_ok == 'no'
        run: exit 1

      - name: Cleanup
        if: always()
        run: |
          ./gradlew --stop >/dev/null 2>&1 || true
          rm -f /tmp/build.log /tmp/payload.json /tmp/current.md /tmp/update_check2.py || true