name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'stonecutter.properties.toml'
      - 'ver.txt'
      - '.github/workflows/publish.yml'
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.actor == 'huhuhuhuheh'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
      matrix: ${{ steps.meta.outputs.matrix }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and publish metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod.version = ' stonecutter.properties.toml | head -1 | sed -E 's/^mod.version = "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          ALL_VERSIONS=$(grep -oE '^\["[^"]+"\]' stonecutter.properties.toml | tr -d '[]"' | paste -sd, -)
          echo "all_versions=$ALL_VERSIONS" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'game_versions=' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          HEAD_SHA=$(git rev-parse HEAD)
          PR_NUMBER=$(gh pr list --state merged --json number,mergeCommit --jq '.[] | select(.mergeCommit.oid == "'$HEAD_SHA'") | .number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          MCVER=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')
            MCVER=$(echo "$PR_BODY" | grep '^mcver=' | head -1 | cut -d= -f2)
          fi

          if [ -n "$MCVER" ]; then
            echo "Using MC version from PR body: $MCVER"
            echo "game_versions=$MCVER" >> "$GITHUB_OUTPUT"
          else
            echo "No PR metadata found, using all versions: $ALL_VERSIONS"
            echo "game_versions=$ALL_VERSIONS" >> "$GITHUB_OUTPUT"
            MCVER="$ALL_VERSIONS"
          fi

          python3 - "$MCVER" "$ALL_VERSIONS" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          selected_spec = sys.argv[1].strip()
          all_versions = [v.strip() for v in sys.argv[2].split(",") if v.strip()]

          def version_range(start, end):
              try:
                  si = all_versions.index(start.strip())
                  ei = all_versions.index(end.strip())
              except ValueError:
                  return [start.strip(), end.strip()]
              lo, hi = sorted((si, ei))
              return all_versions[lo:hi + 1]

          def expand(spec):
              spec = spec.strip()
              if spec.startswith("[") and spec.endswith("]"):
                  inner = spec[1:-1]
                  if "," in inner:
                      start, end = inner.split(",", 1)
                      return version_range(start, end)
                  return [inner.strip()]
              if "," in spec:
                  return [v.strip() for v in spec.split(",") if v.strip()]
              if "-" in spec:
                  start, end = spec.split("-", 1)
                  return version_range(start, end)
              return [spec]

          selected = expand(selected_spec)
          include = []
          for index, game_version in enumerate(selected):
              major, minor = (int(part) for part in game_version.split(".")[:2])
              include.append({
                  "game_version": game_version,
                  "java": 25 if (major, minor) >= (26, 1) else 21,
                  "featured": index == len(selected) - 1,
              })

          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

      - name: Generate changelog
        if: steps.meta.outputs.skip == 'false'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="main"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          git log $RANGE --pretty=format:"- %s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" --reverse > changelog.md
          sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' changelog.md > changelog-curse.txt
          echo "Changelog (MD):"
          cat changelog.md
          echo "Changelog (plain):"
          cat changelog-curse.txt

      - name: Upload changelog
        if: steps.meta.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: |
            changelog.md
            changelog-curse.txt

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew buildAndCollect 2>&1

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/${{ needs.prepare.outputs.version }}/

  publish-platforms:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs/${{ needs.prepare.outputs.version }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Find primary jar
        id: jar
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          MC_VERSION="${{ matrix.game_version }}"
          PRIMARY=$(find "build/libs/$VERSION" -maxdepth 1 -type f -name "*+${MC_VERSION}.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$PRIMARY" ]; then
            echo "No primary jar found for $MC_VERSION" >&2
            exit 1
          fi
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and CurseForge
        uses: ehshit/ehmc-publish-action@v1.0.0
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          version: v${{ needs.prepare.outputs.version }}+${{ matrix.game_version }}
          name: Daily Menu Panoramas v${{ needs.prepare.outputs.version }} for ${{ matrix.game_version }}
          game-versions: ${{ matrix.game_version }}
          java: ${{ matrix.java }}
          modrinth-featured: ${{ matrix.featured }}
          changelog-file: changelog.md
          files: |
            build/libs/${{ needs.prepare.outputs.version }}/*+${{ matrix.game_version }}.jar
            build/libs/${{ needs.prepare.outputs.version }}/*+${{ matrix.game_version }}-sources.jar
          primary-file: ${{ steps.jar.outputs.primary }}
          dependencies: |
            fabric(required){modrinth:P7dR8mSH}{curseforge:306612}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}{curseforge:308769}

  publish-github:
    needs: [prepare, build, publish-platforms]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs/${{ needs.prepare.outputs.version }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Publish to GitHub Releases
        uses: ehshit/ehmc-publish-action@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}
          name: Daily Menu Panoramas v${{ needs.prepare.outputs.version }}
          changelog-file: changelog.md
          files: build/libs/${{ needs.prepare.outputs.version }}/*

  publish-gitgay:
    needs: [prepare, build, publish-platforms]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: build/libs/${{ needs.prepare.outputs.version }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Publish to git.gay
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: https://git.gay
          repository: huhuhuhuheh/daily-menu-panoramas
          token: ${{ secrets.GITGAY_TOKEN }}
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Daily Menu Panoramas v${{ needs.prepare.outputs.version }}
          body_path: changelog.md
          files: build/libs/${{ needs.prepare.outputs.version }}/*