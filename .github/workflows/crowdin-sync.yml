name: Crowdin Translations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          download_translations: true
          crowdin_branch_name: main
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: 'New Crowdin Translations'
          pull_request_body: |
            Translations come from [Crowdin](https://crowdin.com/project/daily-menu-panoramas), until this PR is merged, they do not come to life, and this PR will keep adding more...
          pull_request_base_branch_name: main
          pull_request_assignees: huhuhuhuheh
          skip_untranslated_files: true
          github_user_name: github-actions[bot]
          github_user_email: 41898282+github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}